<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1f"/>
      <stop offset="50%" stop-color="#120c29"/>
      <stop offset="100%" stop-color="#050512"/>
    </linearGradient>
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#ff0080"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="neonP2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#p2Bg)"/>

  <!-- Circuit & Grid Lines -->
  <g stroke="rgba(121, 40, 202, 0.15)" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Header Banner Card -->
  <g transform="translate(220, 25)">
    <rect width="360" height="38" rx="19" fill="#130e2e" stroke="url(#energyGrad)" stroke-width="1.5"/>
    <text x="180" y="24" fill="#00f2fe" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">DIGITAL ENERGY TWIN • AI OPTIMIZER</text>
  </g>

  <!-- Main AI Prediction Telemetry Chart Panel -->
  <g transform="translate(60, 90)">
    <rect width="460" height="360" rx="16" fill="#0e0a24" fill-opacity="0.8" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Title bar -->
    <text x="25" y="35" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Predictive Load Curve &amp; Anomaly Detection</text>
    <text x="25" y="55" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="11">Real-time Telemetry vs AI-Optimized Target (-24.6% Consumption)</text>

    <!-- Graph Axis -->
    <line x1="45" y1="310" x2="420" y2="310" stroke="#334155" stroke-width="1"/>
    <line x1="45" y1="90" x2="45" y2="310" stroke="#334155" stroke-width="1"/>

    <!-- Grid inside graph -->
    <line x1="45" y1="240" x2="420" y2="240" stroke="#1e1b4b" stroke-dasharray="4 4"/>
    <line x1="45" y1="170" x2="420" y2="170" stroke="#1e1b4b" stroke-dasharray="4 4"/>
    <line x1="45" y1="100" x2="420" y2="100" stroke="#1e1b4b" stroke-dasharray="4 4"/>

    <!-- Unoptimized Baseline (Dashed Red/Purple) -->
    <path d="M45 230 Q120 120 200 210 T320 150 T420 190" fill="none" stroke="#ff0080" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

    <!-- AI Optimized Area Fill -->
    <path d="M45 280 C110 240, 150 160, 220 230 C280 290, 330 200, 420 220 L420 310 L45 310 Z" fill="url(#chartFill)"/>
    
    <!-- AI Optimized Path (Glowing Cyan) -->
    <path d="M45 280 C110 240, 150 160, 220 230 C280 290, 330 200, 420 220" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#neonP2)"/>

    <!-- Anomaly Point -->
    <circle cx="280" cy="180" r="7" fill="#ff0080" filter="url(#neonP2)"/>
    <rect x="250" y="135" width="95" height="26" rx="6" fill="#ff0080"/>
    <text x="297" y="152" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ANOMALY DETECTED</text>

    <!-- Legend -->
    <circle cx="55" cy="335" r="4" fill="#00f2fe"/>
    <text x="68" y="339" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">AI Optimized Twin</text>
    <circle cx="210" cy="335" r="4" fill="#ff0080"/>
    <text x="223" y="339" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Raw Baseline Load</text>
  </g>

  <!-- Right Metrics Stack -->
  <!-- Stat Card 1 -->
  <g transform="translate(545, 90)">
    <rect width="195" height="105" rx="14" fill="#0f0c29" stroke="#7928ca" stroke-width="1.5"/>
    <text x="20" y="32" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="12" font-weight="600">ENERGY SAVED</text>
    <text x="20" y="68" fill="#38ef7d" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700">-24.6%</text>
    <text x="20" y="90" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Adaptive Scheduling</text>
  </g>

  <!-- Stat Card 2 -->
  <g transform="translate(545, 215)">
    <rect width="195" height="105" rx="14" fill="#0f0c29" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="20" y="32" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">ML INFERENCE</text>
    <text x="20" y="68" fill="#00f2fe" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700">12ms</text>
    <text x="20" y="90" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Edge Microcontroller</text>
  </g>

  <!-- Stat Card 3 -->
  <g transform="translate(545, 340)">
    <rect width="195" height="110" rx="14" fill="#0f0c29" stroke="#ff0080" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="12" font-weight="600">ACCURACY SCORE</text>
    <text x="20" y="68" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700">98.4%</text>
    <text x="20" y="92" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Anomaly Detection F1</text>
  </g>
</svg>
