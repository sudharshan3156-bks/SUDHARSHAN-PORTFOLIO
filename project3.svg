<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111e"/>
      <stop offset="50%" stop-color="#0a192e"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="p3Accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="p3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#p3Bg)"/>

  <!-- Subtle Code Grid Lines -->
  <g stroke="rgba(79, 172, 254, 0.08)" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Browser Mockup Window -->
  <g transform="translate(70, 50)">
    <!-- Browser Frame -->
    <rect width="660" height="400" rx="14" fill="#0d1b2a" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
    
    <!-- Browser Top Bar -->
    <rect width="660" height="38" rx="14" fill="#15263d"/>
    <circle cx="22" cy="19" r="5" fill="#ef4444"/>
    <circle cx="38" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="19" r="5" fill="#10b981"/>
    
    <!-- Address Bar -->
    <rect x="80" y="8" width="340" height="22" rx="6" fill="#091322"/>
    <text x="100" y="23" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">https://engineering-portal.app/dashboard</text>

    <!-- Navigation Badges -->
    <rect x="520" y="8" width="120" height="22" rx="6" fill="rgba(0, 242, 254, 0.15)"/>
    <text x="580" y="23" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">ACTIVE REST API</text>

    <!-- Sidebar Inside App -->
    <rect x="0" y="38" width="130" height="362" fill="#091322" opacity="0.9"/>
    <line x1="130" y1="38" x2="130" y2="400" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    
    <!-- Sidebar Links -->
    <rect x="12" y="60" width="106" height="24" rx="6" fill="rgba(79, 172, 254, 0.2)"/>
    <text x="25" y="76" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Dashboard</text>
    <text x="25" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Projects</text>
    <text x="25" y="148" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Database</text>
    <text x="25" y="184" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">API Status</text>
    <text x="25" y="220" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Settings</text>

    <!-- Main Content Area Inside App -->
    <!-- Metrics Row -->
    <g transform="translate(150, 58)">
      <rect width="150" height="70" rx="8" fill="#13233c" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1"/>
      <text x="14" y="25" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">ACTIVE USERS</text>
      <text x="14" y="52" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">1,420+</text>
      <circle cx="130" cy="20" r="4" fill="#10b981"/>
    </g>

    <g transform="translate(315, 58)">
      <rect width="150" height="70" rx="8" fill="#13233c" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1"/>
      <text x="14" y="25" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">QUERY LATENCY</text>
      <text x="14" y="52" fill="#00f2fe" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">4.2 ms</text>
      <circle cx="130" cy="20" r="4" fill="#00f2fe"/>
    </g>

    <g transform="translate(480, 58)">
      <rect width="160" height="70" rx="8" fill="#13233c" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1"/>
      <text x="14" y="25" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">UPTIME / RELIABILITY</text>
      <text x="14" y="52" fill="#38ef7d" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">99.98%</text>
      <circle cx="140" cy="20" r="4" fill="#38ef7d"/>
    </g>

    <!-- Data Table / Code Integration View -->
    <g transform="translate(150, 145)">
      <rect width="490" height="230" rx="10" fill="#091322" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <!-- Table Header -->
      <rect width="490" height="34" rx="10" fill="#13233c"/>
      <text x="20" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">METHOD</text>
      <text x="120" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ENDPOINT</text>
      <text x="320" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">RESPONSE</text>
      <text x="420" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">STATUS</text>

      <!-- Row 1 -->
      <line x1="0" y1="72" x2="490" y2="72" stroke="rgba(255,255,255,0.05)"/>
      <rect x="20" y="47" width="45" height="18" rx="4" fill="#0284c7"/>
      <text x="42" y="60" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">GET</text>
      <text x="120" y="60" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">/api/v1/sensors</text>
      <text x="320" y="60" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11">application/json</text>
      <text x="420" y="60" fill="#38ef7d" font-family="'JetBrains Mono', monospace" font-size="11">200 OK</text>

      <!-- Row 2 -->
      <line x1="0" y1="112" x2="490" y2="112" stroke="rgba(255,255,255,0.05)"/>
      <rect x="20" y="87" width="45" height="18" rx="4" fill="#10b981"/>
      <text x="42" y="100" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">POST</text>
      <text x="120" y="100" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">/api/v1/telemetry</text>
      <text x="320" y="100" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11">encrypted/payload</text>
      <text x="420" y="100" fill="#38ef7d" font-family="'JetBrains Mono', monospace" font-size="11">201 CREATED</text>

      <!-- Row 3 -->
      <line x1="0" y1="152" x2="490" y2="152" stroke="rgba(255,255,255,0.05)"/>
      <rect x="20" y="127" width="45" height="18" rx="4" fill="#0284c7"/>
      <text x="42" y="140" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">GET</text>
      <text x="120" y="140" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">/api/v1/analytics</text>
      <text x="320" y="140" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11">timeseries/stream</text>
      <text x="420" y="140" fill="#38ef7d" font-family="'JetBrains Mono', monospace" font-size="11">200 OK</text>

      <!-- Row 4 -->
      <line x1="0" y1="192" x2="490" y2="192" stroke="rgba(255,255,255,0.05)"/>
      <rect x="20" y="167" width="45" height="18" rx="4" fill="#f59e0b"/>
      <text x="42" y="180" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">PUT</text>
      <text x="120" y="180" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">/api/v1/settings</text>
      <text x="320" y="180" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11">config/object</text>
      <text x="420" y="180" fill="#38ef7d" font-family="'JetBrains Mono', monospace" font-size="11">200 OK</text>
    </g>
  </g>
</svg>
