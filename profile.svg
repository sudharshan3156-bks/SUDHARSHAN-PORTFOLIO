<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1026"/>
      <stop offset="50%" stop-color="#0e1738"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Tech Circuit Details -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  
  <!-- Circular HUD Rings -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="12 8"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#7928ca" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 6"/>
  
  <!-- Tech Circuit Node Lines -->
  <line x1="20" y1="200" x2="60" y2="200" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="60" cy="200" r="4" fill="#00f2fe" filter="url(#glowEffect)"/>
  
  <line x1="380" y1="200" x2="340" y2="200" stroke="#4facfe" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="340" cy="200" r="4" fill="#4facfe" filter="url(#glowEffect)"/>

  <line x1="200" y1="20" x2="200" y2="55" stroke="#38ef7d" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="200" cy="55" r="3.5" fill="#38ef7d"/>

  <!-- Stylish Engineer / Developer Silhouette -->
  <!-- Shoulders / Jacket -->
  <path d="M100 370 C100 310, 130 280, 160 270 L170 275 L200 290 L230 275 L240 270 C270 280, 300 310, 300 370 Z" fill="#131e42" stroke="url(#ringGrad)" stroke-width="2"/>
  
  <!-- Inner Collar / Shirt -->
  <path d="M170 275 L200 320 L230 275 L200 290 Z" fill="#0d142d" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Neck -->
  <path d="M175 220 L175 280 L225 280 L225 220 Z" fill="#f8bb86" opacity="0.9"/>

  <!-- Head Base -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#f8bb86"/>

  <!-- Modern Hair -->
  <path d="M140 180 C135 130, 160 100, 200 98 C240 96, 265 125, 260 175 C255 140, 240 120, 200 122 C160 124, 145 150, 140 180 Z" fill="#1e293b"/>
  <path d="M150 135 C170 105, 220 102, 255 125 C240 115, 210 110, 185 118 Z" fill="#334155"/>

  <!-- Smart Glasses / Futuristic AR Spectacles -->
  <rect x="155" y="165" width="38" height="24" rx="6" fill="#080e22" fill-opacity="0.8" stroke="#00f2fe" stroke-width="2" filter="url(#glowEffect)"/>
  <rect x="207" y="165" width="38" height="24" rx="6" fill="#080e22" fill-opacity="0.8" stroke="#00f2fe" stroke-width="2" filter="url(#glowEffect)"/>
  <line x1="193" y1="175" x2="207" y2="175" stroke="#00f2fe" stroke-width="2"/>
  <line x1="145" y1="172" x2="155" y2="172" stroke="#00f2fe" stroke-width="2"/>
  <line x1="245" y1="172" x2="255" y2="172" stroke="#00f2fe" stroke-width="2"/>
  
  <!-- Subtle AR Glint in Glasses -->
  <line x1="160" y1="170" x2="185" y2="170" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="212" y1="170" x2="237" y2="170" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Confident Smile -->
  <path d="M185 215 Q200 228 215 215" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tech Accent Badge Overlay -->
  <g transform="translate(130, 315)">
    <rect width="140" height="28" rx="14" fill="#090d20" stroke="url(#accentGrad)" stroke-width="1.5"/>
    <text x="70" y="18" fill="#00f2fe" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ENGINEER</text>
  </g>
</svg>
